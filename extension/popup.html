<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 300px; margin: 12px; color: #222; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #bbb; background: #f5f5f5; cursor: pointer; width: 100%; }
  #stop { background: #c62828; color: #fff; border-color: #c62828; font-weight: 600; }
  #log { list-style: none; padding: 0; margin: 4px 0 0; max-height: 220px; overflow-y: auto; font-size: 12px; }
  #log li { padding: 3px 0; border-bottom: 1px solid #eee; }
  .muted { color: #777; }
  details { margin-top: 10px; }
  input[type=number] { width: 80px; }
  #code { font-size: 14px; letter-spacing: 1px; }
  #problem { color: #c62828; margin: 6px 0; }
</style>
</head>
<body>
  <h1>My Browser</h1>
  <div id="status"></div>
  <div id="problem"></div>
  <div class="row"><label for="enabled">On</label><input type="checkbox" id="enabled"></div>
  <div class="row"><button id="stop">Stop</button></div>
  <div class="row"><button id="share"></button></div>
  <div class="muted">Pairing code (paste it into My Browser in the Claude app)</div>
  <div class="row"><code id="code"></code><button id="copy" style="width:auto">Copy</button></div>
  <div class="muted">Recent actions</div>
  <ul id="log"></ul>
  <details>
    <summary class="muted">Advanced</summary>
    <div class="row"><span>Port</span><input type="number" id="port" min="1024" max="65535"><button id="savePort" style="width:auto">Save</button></div>
  </details>
  <script src="popup.js"></script>
</body>
</html>
